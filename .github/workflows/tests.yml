name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Aqua with optional extras
        run: python -m pip install -e ".[handsfree,desktop]"

      - name: Check dependencies
        run: python -m pip check

      # Sockets and process launches are blocked inside the runner;
      # no models, microphone, Ollama or desktop input are used.
      - name: Run offline test suite
        run: python -B tools/test_offline.py
