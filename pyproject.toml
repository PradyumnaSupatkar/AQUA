[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "aqua-local"
version = "0.8.0"
description = "A local, privacy-first assistant with offline speech and Ollama conversations."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "sounddevice==0.5.6",
    "faster-whisper==1.2.1",
    "numpy==2.5.4",
    "av==19.0.2",
    "sherpa-onnx==2.0.1",
]

[project.optional-dependencies]
# Kept empty so existing `.[handsfree,desktop]` installs still work.
handsfree = []
desktop = ["pywinauto==0.6.9; platform_system == 'Windows'"]

[project.scripts]
aqua = "aqua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aqua.wake" = ["*.keywords"]
